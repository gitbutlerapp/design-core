name: Tokens PR

# Runs on PRs that touch the exported Figma JSON. Rebuilds tokens/tokens.css,
# commits it back onto the PR branch, bumps the version, and comments the CSS
# custom-property diff. Merging the PR is what triggers release.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - tokens/json/**
      - scripts/**
      - terrazzo.config.js

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tokens-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Cheap pre-flight, so a stale run can never rewrite a correct verdict.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether this run can still do anything useful
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          # A run can sit in the queue for a long time. If the PR landed while it
          # waited, there is nothing left to build, push, or say about it — and
          # the comment step would only overwrite the verdict that was correct.
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state -q .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "::notice::PR #$PR is $STATE — nothing to build or comment on."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The build commit this workflow pushes retriggers this workflow:
          # pull_request path filters match the PR's whole diff, not the pushed
          # commit. That second run can only redo what the first already did.
          # Label events still pass — `release:major` must be able to re-bump.
          AUTHOR=$(gh api "repos/$REPO/commits/$HEAD_SHA" -q '.author.login // ""')
          if [ "$ACTION" = "synchronize" ] && [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "::notice::Head commit is this workflow's own build commit — nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The base as of the event that started this run. Never `origin/<base ref>`:
    # that moves while the run is queued, so a run finishing after the merge
    # would diff the merged tokens.css against itself and report no changes.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild tokens.css
        run: |
          cp tokens/tokens.css /tmp/tokens-before.css
          pnpm run build

      - name: Diff CSS custom properties
        id: diff
        run: |
          # Compare against the base commit, not the PR head — the head may
          # already contain a tokens.css this workflow committed earlier.
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}.git" "$BASE_SHA"
          git show "$BASE_SHA:tokens/tokens.css" > /tmp/tokens-base.css 2>/dev/null || : > /tmp/tokens-base.css
          node scripts/diff-css-vars.mjs /tmp/tokens-base.css tokens/tokens.css > /tmp/report.md
          echo "bump=$(node scripts/diff-css-vars.mjs /tmp/tokens-base.css tokens/tokens.css --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).bump')" >> "$GITHUB_OUTPUT"

      - name: Nothing changed
        if: steps.diff.outputs.bump == 'none'
        run: |
          echo "::warning::No CSS custom properties changed — only the tokens-bruecke createdAt stamps moved. Nothing to release."

      - name: Resolve bump level
        id: level
        if: steps.diff.outputs.bump != 'none'
        env:
          DETECTED: ${{ steps.diff.outputs.bump }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          LABEL=$(node -p 'const l=JSON.parse(process.env.LABELS).find(n=>n.startsWith("release:"));l?l.slice(8):""')
          LEVEL="${LABEL:-$DETECTED}"
          # A major is never inferred: removing or renaming a var breaks every
          # consumer of var(--...), and npm versions can never be reused.
          if [ "$LEVEL" = "major" ] && [ "$LABEL" != "major" ]; then
            echo "::error::This PR removes or renames CSS custom properties, which is breaking. Add the 'release:major' label to confirm the major bump."
            exit 1
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        if: steps.diff.outputs.bump != 'none'
        run: |
          BASE=$(git show "$BASE_SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          CURRENT=$(node -p "require('./package.json').version")
          # Only bump once per PR — later pushes keep the version already chosen,
          # unless the label changed the level, in which case re-bump from base.
          if [ "$CURRENT" != "$BASE" ]; then
            npm version "$BASE" --no-git-tag-version --allow-same-version
          fi
          npm version "${{ steps.level.outputs.level }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit generated files
        if: steps.diff.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokens/tokens.css package.json
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git commit -m "Build tokens and bump to ${{ steps.bump.outputs.version }}"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.bump.outputs.version }}
          LEVEL: ${{ steps.level.outputs.level }}
        run: |
          {
            if [ -n "$VERSION" ]; then
              echo "## Token changes → \`$VERSION\` (\`$LEVEL\`)"
              echo
              echo "Merging this PR publishes \`@gitbutler/design-core@$VERSION\` to npm and tags \`$VERSION\`."
            else
              echo "## No token changes"
              echo
              echo "The export rewrote its \`createdAt\` stamps but no CSS custom property changed. Nothing to release."
            fi
            echo
            cat /tmp/report.md
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md --edit-last --create-if-none \
            --repo "${{ github.repository }}"
