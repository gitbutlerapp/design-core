name: Release

# Publishes @gitbutler/design-core to npm whenever the version in package.json
# changes on main. Auth is npm trusted publishing (OIDC) — no token, no 2FA code.
# Registered on npmjs.com as: gitbutlerapp/design-core -> release.yml

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write # push the version tag + create the release
  id-token: write # required for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No cache here on purpose: when the version is already published the
      # install step is skipped, and the post-job cache save then fails on a
      # missing path — reporting a red X for a run that did the right thing.
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          cache: false
          install: false

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publishing and tagging are checked separately: if a run publishes but
      # then fails to tag, re-running it must still create the missing tag.
      - name: What is left to do
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if pnpm view "@gitbutler/design-core@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION is already tagged."
            echo "tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # prepublishOnly also runs this, but building here fails the job early
      # and lets us verify the committed CSS matches the committed JSON.
      - name: Build tokens
        if: steps.check.outputs.publish == 'true'
        run: pnpm run build

      - name: Verify generated CSS is committed
        if: steps.check.outputs.publish == 'true'
        run: |
          if ! git diff --quiet -- tokens/tokens.css; then
            echo "::error::tokens/tokens.css is out of date — run 'pnpm run build' and commit the result."
            git diff -- tokens/tokens.css
            exit 1
          fi

      # pnpm publishes with npm trusted publishing (OIDC), so no token and no
      # npm CLI: the Node pnpm installs doesn't include npm. --ignore-scripts
      # skips prepublishOnly, since the build already ran and was verified above.
      - name: Publish to npm
        id: publish
        if: steps.check.outputs.publish == 'true'
        run: pnpm publish --ignore-scripts --no-git-checks

      # Runs whenever the tag is missing and the version is on npm — either just
      # published above, or published by an earlier run that failed to tag.
      - name: Tag and release
        if: steps.check.outputs.tag == 'true' && (steps.publish.outcome == 'success' || steps.check.outputs.publish == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes
